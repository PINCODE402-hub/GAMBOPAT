        <link rel="icon" type="image/png" href="favicon-32x32.png">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <div class="hed-f">
                <div><img src="images/gambo logo.jpeg" alt="Gambo Logo"></div>
                <div><span class="gg">GAMBOPAT ENGINEERING</span></div>
            </div>
            <button class="menu-btn" onclick="toggleMenu()">☰</button>
            <nav id="nav" class="nav">
                <a href="index.html">Home</a>
                <a href="window.html">Windows</a>
                <a href="security-door.html">Doors</a>
                <a href="chairs-tables.html">Furniture</a>
                <a href="">Photo Gallery</a>
                <a href="admin.html" style="color: #ffcc00; font-weight: bold;">Admin Panel</a>
                <a href="https://wa.me/233557313743" target="_blank" class="cta">WhatsApp</a>
            </nav>
        </header>

        <section class="hero">
            <h2>Main Gate Designs</h2>
            <p>Strong, modern and secure gate fabrication in Ghana</p>
        </section>

        <section class="gallery" id="dynamic-gallery">
        </section>

        <div class="image-viewer" id="imageViewer">
            <span class="close-btn" onclick="closeViewer()">×</span>
            <img id="fullImage" alt="Expanded gate view">
        </div>

        <section class="cta-section">
            <h2>Need a Custom Gate?</h2>
            <p>Contact us today for professional fabrication</p>
            <a href="https://wa.me/233557313743" target="_blank">Chat on WhatsApp</a>
        </section>

        <footer>
            <p>© 2026 Gambopat Engineering & Training Center</p>
        </footer>

        <script>
            function toggleMenu(){
                document.getElementById("nav").classList.toggle("show");
            }

            const imageViewer = document.getElementById("imageViewer");
            const fullImage = document.getElementById("fullImage");
            window.zoomed = false;

            function closeViewer(){
                imageViewer.style.display = "none";
            }

            // CLICK TO ZOOM
            fullImage.addEventListener("click", () => {
                if(!window.zoomed){
                    fullImage.style.transform = "scale(2)";
                    fullImage.style.cursor = "zoom-out";
                    window.zoomed = true;
                }else{
                    fullImage.style.transform = "scale(1)";
                    fullImage.style.cursor = "zoom-in";
                    window.zoomed = false;
                }
            });

            function orderWhatsApp(productName, imageUrl){
                let phoneNumber = "233557313743";
                let message = imageUrl
                    ? `I am interested in your product: ${productName}. Here is the image: ${imageUrl}`
                    : `I am interested in your product: ${productName}`;

                let whatsappURL = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
                window.open(whatsappURL, "_blank");
            }

            // Listens to local storage configurations set by the header switches automatically
            function applySavedTheme() {
                if (localStorage.getItem('lightTheme') === 'true') {
                    document.body.classList.add('light-theme');
                } else {
                    document.body.classList.remove('light-theme');
                }
            }

            // Fire on document load instances
            document.addEventListener("DOMContentLoaded", applySavedTheme);
        </script>

        <script type="module">
            import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
            import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

            // Your web app's Firebase configuration
            const firebaseConfig = {
                apiKey: "AIzaSyCzbU6d1wh6sezdM1ixhQrA-TCVCHpm-AA",
                authDomain: "gambopat-327be.firebaseapp.com",
                projectId: "gambopat-327be",
                storageBucket: "gambopat-327be.firebasestorage.app",
                messagingSenderId: "334515883953",
                appId: "1:334515883953:web:3cd35ada86b25770a53790",
                measurementId: "G-Y9RG1NKHYF"
            };

            // Initialize Firebase
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);

            const galleryContainer = document.getElementById('dynamic-gallery');

            // Fetch items from the 'gates' collection
            async function loadItems() {
                try {
                    galleryContainer.innerHTML = "<p style='color:inherit; grid-column: 1 / -1;'>Loading gate designs...</p>";
                    
                    const querySnapshot = await getDocs(collection(db, "gates"));
                    galleryContainer.innerHTML = ""; // Clear loading state
                    
                    if(querySnapshot.empty) {
                        galleryContainer.innerHTML = "<p style='color:inherit; grid-column: 1 / -1;'>No designs uploaded yet.</p>";
                        return;
                    }

                    querySnapshot.forEach((doc) => {
                        const item = doc.data();
                        const safeName = item.name.replace(/'/g, "\\'");
                        
                        // Create the card HTML dynamically
                        const cardHtml = `
                            <div class="card">
                                <img 
                                    src="${item.imageUrl}"
                                    class="product-img"
                                    alt="${item.name}"
                                >
                                <div class="info">
                                    <p>${item.name}</p>
                                    <button onclick="orderWhatsApp('${safeName}', '${item.imageUrl}')">
                                        Order on WhatsApp
                                    </button>
                                </div>
                            </div>
                        `;
                        
                        galleryContainer.innerHTML += cardHtml;
                    });

                    // Re-attach the click-to-zoom listeners to the newly created images
                    attachZoomListeners();

                    // Check URL parameters for slideshow links
                    checkUrlParametersForZoom();

                } catch (error) {
                    console.error("Error loading items:", error);
                    galleryContainer.innerHTML = "<p style='color:red; grid-column: 1 / -1;'>Error loading gallery.</p>";
                }
            }

            function attachZoomListeners() {
                const productImages = document.querySelectorAll(".product-img");
                const imageViewer = document.getElementById("imageViewer");
                const fullImage = document.getElementById("fullImage");

                productImages.forEach(img => {
                    img.addEventListener("click", () => {
                        imageViewer.style.display = "flex";
                        fullImage.src = img.src;
                        fullImage.style.transform = "scale(1)";
                        window.zoomed = false;
                    });
                });
            }

            function checkUrlParametersForZoom() {
                const urlParams = new URLSearchParams(window.location.search);
                const targetImgUrl = urlParams.get('img');
                
                if (targetImgUrl) {
                    const imageViewer = document.getElementById("imageViewer");
                    const fullImage = document.getElementById("fullImage");
                    
                    if (imageViewer && fullImage) {
                        imageViewer.style.display = "flex";
                        fullImage.src = targetImgUrl;
                        fullImage.style.transform = "scale(1)";
                        window.zoomed = false;
                    }
                }
            }

            // Run the fetch on page load
            loadItems();
        </script>
    </body>
</html>
