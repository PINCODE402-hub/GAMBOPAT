<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gambopat Terminal</title>
    <meta name="robots" content="noindex, nofollow">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0d0d; --surface-color: #1a1a1a;
            --text-main: #f5f5f5; --text-muted: #a0a0a0;
            --gold: #D4AF37; --danger: #ff4d4d;
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 40px 20px; display: flex; justify-content: center; }
        
        .container { 
            width: 100%; max-width: 600px; 
            background: var(--surface-color); padding: 40px; 
            border-radius: 16px; border: 1px solid var(--glass-border);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        h2 { color: var(--gold); margin-top: 0; margin-bottom: 30px; text-align: center; letter-spacing: 1px; }
        h3 { border-bottom: 1px solid var(--glass-border); padding-bottom: 10px; margin-top: 30px; color: #fff; }
        
        label { display: block; margin-top: 20px; font-weight: 500; font-size: 0.9rem; color: var(--text-muted); }
        
        input[type="text"], input[type="url"], input[type="email"], input[type="password"], input[type="file"], select { 
            width: 100%; padding: 14px; margin-top: 8px; border-radius: 8px; 
            background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); 
            color: var(--text-main); font-family: 'Poppins', sans-serif; box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input:focus, select:focus { outline: none; border-color: var(--gold); }

        button { 
            width: 100%; background-color: var(--gold); color: #111; 
            border: none; font-weight: bold; cursor: pointer; padding: 14px;
            margin-top: 25px; border-radius: 8px; transition: 0.3s; font-size: 1rem;
        }
        button:hover { background-color: #b5952f; box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }
        button:disabled { background-color: #555; color: #888; cursor: not-allowed; box-shadow: none; }
        
        .hidden { display: none !important; }
        
        /* Item List UI */
        .item-row { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px; margin-top: 10px; background: rgba(0,0,0,0.2); 
            border: 1px solid var(--glass-border); border-radius: 8px;
        }
        .item-row img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; border: 1px solid var(--glass-border); }
        .delete-btn { width: auto; background-color: transparent; border: 1px solid var(--danger); color: var(--danger); padding: 8px 16px; margin: 0; }
        .delete-btn:hover { background-color: var(--danger); color: white; box-shadow: 0 0 10px rgba(255, 77, 77, 0.4); }
        
        /* Radio Toggles */
        .source-toggle { display: flex; gap: 20px; margin-top: 10px; }
        .source-toggle label { display: flex; align-items: center; gap: 8px; margin: 0; color: var(--text-main); cursor: pointer; }
        .source-toggle input { accent-color: var(--gold); width: 18px; height: 18px; cursor: pointer; }
        
        .nav-links { text-align: center; margin-bottom: 30px; font-size: 0.9rem; color: var(--text-muted); }
        .nav-links a { color: var(--gold); text-decoration: none; margin: 0 10px; }
        .nav-links a:hover { text-decoration: underline; }

        /* Mobile admin improvements - preserves the existing theme */
        .admin-stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:15px; }
        .admin-stat { background:rgba(0,0,0,.2); border:1px solid var(--glass-border); border-radius:8px; padding:12px; text-align:center; min-width:0; }
        .admin-stat strong { display:block; color:var(--gold); font-size:1.25rem; }
        .admin-stat span { color:var(--text-muted); font-size:.72rem; }
        .gallery-tools { display:grid; grid-template-columns:minmax(0,1fr) minmax(150px,.7fr) minmax(150px,.7fr) auto; gap:10px; align-items:center; }
        .gallery-tools input, .gallery-tools select { margin-top:0; }
        .gallery-count { color:var(--text-muted); font-size:.8rem; white-space:nowrap; }
        .admin-row-actions { display:flex; gap:8px; flex-shrink:0; }
        .edit-btn { width:auto; background:transparent; color:var(--gold); border:1px solid var(--gold); padding:8px 16px; margin:0; }
        .edit-btn:hover { background:var(--gold); color:#111; box-shadow:0 0 10px rgba(212,175,55,.3); }
        .drag-handle { color:var(--text-muted); cursor:grab; padding:4px; flex-shrink:0; }
        .item-row.dragging { opacity:.55; }
        .item-row.drop-target { border-color:var(--gold); }
        .admin-item-meta { color:var(--text-muted); font-size:.7rem; margin-top:3px; overflow-wrap:anywhere; }
        .new-design-badge { background:var(--gold); color:#111; border-radius:999px; padding:2px 7px; font-size:.6rem; font-weight:700; }
        @media (max-width: 700px) {
            body { padding:12px 8px; align-items:flex-start; }
            .container { max-width:none; padding:20px 14px; border-radius:12px; }
            h2 { font-size:1.2rem; margin-bottom:20px; }
            h3 { font-size:1rem; margin-top:24px; }
            .admin-stats { grid-template-columns:repeat(2,minmax(0,1fr)); }
            .source-toggle { flex-direction:column; gap:10px; }
            .source-toggle label { padding:5px 0; }
            .gallery-tools { grid-template-columns:1fr 1fr; }
            .gallery-tools input { grid-column:1 / -1; }
            .gallery-count { grid-column:1 / -1; }
            .item-row { display:grid; grid-template-columns:auto 54px minmax(0,1fr); gap:8px; align-items:start; }
            .item-row img { width:54px; height:54px; }
            .admin-row-actions { grid-column:1 / -1; width:100%; display:grid; grid-template-columns:1fr 1fr; margin-top:6px; }
            .admin-row-actions button { width:100%; }
            .nav-links { line-height:1.8; }
            input[type="text"], input[type="url"], input[type="email"], input[type="password"], input[type="file"], select { font-size:16px; }
        }
        @media (max-width: 400px) {
            .gallery-tools { grid-template-columns:1fr; }
            .gallery-tools input, .gallery-count { grid-column:auto; }
            .admin-stats { grid-template-columns:1fr 1fr; gap:7px; }
            .admin-stat { padding:9px 5px; }
        }
    </style>
</head>
<body>

    <div id="login-section" class="container">
        <h2>TERMINAL ACCESS</h2>
        <label>Email ID</label>
        <input type="email" id="login-email" placeholder="admin@gambopat.com">
        <label>Security Key</label>
        <input type="password" id="login-password" placeholder="••••••••">
        <button id="btn-login">Authenticate</button>
        <div class="nav-links" style="margin-top: 30px;"><a href="index.html">← Return to Main Website</a></div>
    </div>

    <div id="admin-section" class="container hidden">
        <h2>DATABASE MANAGER</h2>
        <div class="nav-links">
            Status: Secure Connection | <a href="#" id="btn-logout">Terminate Session</a> | <a href="index.html">Live Site</a>
        </div>
        
        <h3>Showroom Overview</h3>
        <div class="admin-stats" id="admin-stats">
            <div class="admin-stat"><strong id="stat-total">—</strong><span>Total designs</span></div>
            <div class="admin-stat"><strong id="stat-featured">—</strong><span>Featured</span></div>
            <div class="admin-stat"><strong id="stat-new">—</strong><span>Added in 30 days</span></div>
            <div class="admin-stat"><strong id="stat-views">—</strong><span>Total views</span></div>
            <div class="admin-stat"><strong id="stat-enquiries">—</strong><span>WhatsApp enquiries</span></div>
            <div class="admin-stat"><strong id="stat-tags">—</strong><span>Unique tags</span></div>
        </div>

        <h3>Deploy New Blueprint</h3>
        <label>Target Category</label>
        <select id="item-category">
            <option value="gates">Main Gates</option>
            <option value="windows">Window Frames</option>
            <option value="doors">Security Doors</option>
            <option value="staircases">Staircases</option>
            <option value="balustrades">Balustrades</option>
            <option value="furniture">Chairs & Tables</option>
            <option value="custom">Custom & Repairs</option>
        </select>

        <label>Design Identifier (Name)</label>
        <input type="text" id="item-name" placeholder="e.g., Modern Arch Gate V2">

        <label>Tags (comma separated)</label>
        <input type="text" id="item-tags" placeholder="e.g., Modern, Sliding, Double Gate">

        <label style="display:flex;align-items:center;gap:8px;color:var(--text-main);cursor:pointer;"><input type="checkbox" id="item-featured" style="accent-color:var(--gold);width:18px;height:18px;"> Mark as Featured</label>

        <label>Asset Source</label>
        <div class="source-toggle">
            <label><input type="radio" name="image-source" value="upload" checked> Local Drive</label>
            <label><input type="radio" name="image-source" value="url"> Cloud URL</label>
        </div>

        <div id="upload-section">
            <label>Select Blueprint Image</label>
            <input type="file" id="item-image" accept="image/*" multiple>
        </div>

        <div id="url-section" class="hidden">
            <label>Remote Image URL</label>
            <input type="url" id="item-url" placeholder="https://res.cloudinary.com/...">
        </div>

        <button id="btn-add">Upload to Showroom</button>

        <h3 style="margin-top: 50px;">Manage Active Showroom</h3>
        <label>Filter Database by Category</label>
        <select id="view-category">
            <option value="gates">Main Gates</option>
            <option value="windows">Window Frames</option>
            <option value="doors">Security Doors</option>
            <option value="staircases">Staircases</option>
            <option value="balustrades">Balustrades</option>
            <option value="furniture">Chairs & Tables</option>
            <option value="custom">Custom & Repairs</option>
        </select>

        <div class="gallery-tools" style="margin-top: 20px;">
            <input type="search" id="admin-search" placeholder="Search uploaded designs..." aria-label="Search uploaded designs">
            <select id="admin-sort" aria-label="Sort uploaded designs">
                <option value="newest">Newest first</option>
                <option value="featured">Featured first</option>
                <option value="oldest">Oldest first</option>
                <option value="name">Name A–Z</option>
                <option value="manual">Manual featured order</option>
            </select>
            <select id="admin-featured-filter" aria-label="Filter featured designs">
                <option value="all">All designs</option>
                <option value="featured">Featured only</option>
                <option value="regular">Non-featured only</option>
            </select>
            <span class="gallery-count" id="admin-count"></span>
        </div>
        <div id="items-list"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const CLOUDINARY_CLOUD_NAME = "dwj32uz3y"; 
        const CLOUDINARY_UPLOAD_PRESET = "Gambopat-preset"; 
        const CLOUDINARY_UPLOAD_URL = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`;

        const firebaseConfig = {
            apiKey: "AIzaSyCzbU6d1wh6sezdM1ixhQrA-TCVCHpm-AA",
            authDomain: "gambopat-327be.firebaseapp.com",
            projectId: "gambopat-327be",
            storageBucket: "gambopat-327be.firebasestorage.app",
            messagingSenderId: "334515883953",
            appId: "1:334515883953:web:3cd35ada86b25770a53790",
            measurementId: "G-Y9RG1NKHYF"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // UI Toggles
        const loginSection = document.getElementById('login-section');
        const adminSection = document.getElementById('admin-section');
        const itemsList = document.getElementById('items-list');
        const viewCategorySelect = document.getElementById('view-category');
        
        document.querySelectorAll('input[name="image-source"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                if(e.target.value === 'upload') {
                    document.getElementById('upload-section').classList.remove('hidden');
                    document.getElementById('url-section').classList.add('hidden');
                } else {
                    document.getElementById('upload-section').classList.add('hidden');
                    document.getElementById('url-section').classList.remove('hidden');
                }
            });
        });

        // Auth
        auth.onAuthStateChanged((user) => {
            if (user) {
                loginSection.classList.add('hidden');
                adminSection.classList.remove('hidden');
                loadManageItems(viewCategorySelect.value);
            } else {
                loginSection.classList.remove('hidden');
                adminSection.classList.add('hidden');
            }
        });

        document.getElementById('btn-login').addEventListener('click', () => {
            auth.signInWithEmailAndPassword(document.getElementById('login-email').value, document.getElementById('login-password').value)
                .catch(err => alert("Access Denied: " + err.message));
        });

        document.getElementById('btn-logout').addEventListener('click', (e) => { e.preventDefault(); auth.signOut(); });

        // Add Item Data
        document.getElementById('btn-add').addEventListener('click', async () => {
            const category = document.getElementById('item-category').value;
            const name = document.getElementById('item-name').value.trim();
            const tags = document.getElementById('item-tags').value.split(',').map(t => t.trim()).filter(Boolean);
            const featured = document.getElementById('item-featured').checked;
            const sourceMode = document.querySelector('input[name="image-source"]:checked').value;
            const btnAdd = document.getElementById('btn-add');
            
            if(!name) { alert("Please assign a Design Identifier!"); return; }

            try {
                btnAdd.disabled = true;

                if (sourceMode === "upload") {
                    const files = document.getElementById('item-image').files;
                    if(files.length === 0) { alert("Attach a file to deploy."); btnAdd.disabled = false; return; }
                    
                    btnAdd.innerText = `Uploading ${files.length} assets...`;
                    const uploadPromises = Array.from(files).map(async (file) => {
                        const formData = new FormData();
                        formData.append('file', file);
                        formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
                        const response = await fetch(CLOUDINARY_UPLOAD_URL, { method: 'POST', body: formData });
                        const data = await response.json();
                        if (!response.ok) throw new Error("Upload Interrupted.");
                        return data.secure_url;
                    });

                    const uploadedUrls = await Promise.all(uploadPromises);
                    btnAdd.innerText = "Syncing Database...";
                    await Promise.all(uploadedUrls.map(url => db.collection(category).add({ name, imageUrl: url, tags, featured, featuredOrder: featured ? Date.now() : 999999999, views: 0, enquiries: 0, createdAt: Date.now() })));
                } else {
                    const finalImageUrl = document.getElementById('item-url').value;
                    if(!finalImageUrl) { alert("Enter an image URL."); btnAdd.disabled = false; return; }
                    btnAdd.innerText = "Syncing Database...";
                    await db.collection(category).add({ name, imageUrl: finalImageUrl, tags, featured, featuredOrder: featured ? Date.now() : 999999999, views: 0, enquiries: 0, createdAt: Date.now() });
                }

                alert("Blueprint Deployed Successfully!");
                document.getElementById('item-name').value = ""; document.getElementById('item-image').value = ""; document.getElementById('item-url').value = "";
            } catch (error) {
                alert("System Error: " + error.message);
            } finally {
                btnAdd.innerText = "Upload to Showroom"; btnAdd.disabled = false;
            }
        });

        // Live List, search, sorting, edit and delete
        let unsubscribeLiveList;
        let managedItems = [];
        const adminSearch = document.getElementById('admin-search');
        const adminSort = document.getElementById('admin-sort');
        const adminCount = document.getElementById('admin-count');
        let manageItems = [];

        function getCreatedTime(item) {
            if (!item.createdAt) return 0;
            if (typeof item.createdAt.toMillis === 'function') return item.createdAt.toMillis();
            if (typeof item.createdAt === 'number') return item.createdAt;
            return Date.parse(item.createdAt) || 0;
        }

        function escapeHtml(value = "") {
            return String(value).replace(/[&<>"']/g, char => ({
                '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;'
            }[char]));
        }

        function renderManageItems() {
            const query = (adminSearch?.value || '').trim().toLowerCase();
            const sort = adminSort?.value || 'newest';
            const featuredFilter = document.getElementById('admin-featured-filter')?.value || 'all';
            let filtered = [...manageItems].filter(item => {
                const name = String(item.name || '').toLowerCase();
                const tags = Array.isArray(item.tags) ? item.tags : String(item.tags || '').split(',').map(t=>t.trim()).filter(Boolean);
                if (query && !name.includes(query) && !tags.some(t => t.toLowerCase().includes(query))) return false;
                if (featuredFilter === 'featured' && !item.featured) return false;
                if (featuredFilter === 'regular' && item.featured) return false;
                return true;
            });
            filtered.sort((a,b) => {
                if (sort === 'featured') {
                    if (Boolean(b.featured) !== Boolean(a.featured)) return b.featured ? 1 : -1;
                    return Number(a.featuredOrder ?? 999999999) - Number(b.featuredOrder ?? 999999999) || getCreatedTime(b)-getCreatedTime(a);
                }
                if (sort === 'manual') return Number(a.featuredOrder ?? 999999999) - Number(b.featuredOrder ?? 999999999);
                if (sort === 'oldest') return getCreatedTime(a)-getCreatedTime(b);
                if (sort === 'name') return String(a.name||'').localeCompare(String(b.name||''));
                return getCreatedTime(b)-getCreatedTime(a);
            });
            if (adminCount) adminCount.textContent = `${filtered.length} item${filtered.length===1?'':'s'}`;
            itemsList.innerHTML = '';
            if (!filtered.length) { itemsList.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:20px 0;">No designs match your filters.</p>'; return; }
            filtered.forEach(data => {
                const row = document.createElement('div');
                row.className = 'item-row'; row.draggable = true; row.dataset.id = data.id;
                const tags = Array.isArray(data.tags) ? data.tags : String(data.tags||'').split(',').map(t=>t.trim()).filter(Boolean);
                const dateText = getCreatedTime(data) ? new Date(getCreatedTime(data)).toLocaleString() : 'Date unavailable';
                const optimized = optimizeImageUrl(data.imageUrl || '', 300);
                row.innerHTML = `<span class="drag-handle" title="Drag to reorder featured designs">☷</span>
                    <img src="${escapeHtml(optimized)}" alt="">
                    <div style="flex:1;margin-left:10px;min-width:0;">
                        <span style="font-weight:500;display:block;">${escapeHtml(data.name||'Untitled design')} ${data.featured?'<span class="new-design-badge" style="position:static;display:inline-block;">FEATURED</span>':''}</span>
                        <div class="admin-item-meta">Posted: ${escapeHtml(dateText)} · Views: ${Number(data.views||0)} · Enquiries: ${Number(data.enquiries||0)}</div>
                        ${tags.length ? `<div class="admin-item-meta">Tags: ${escapeHtml(tags.join(', '))}</div>` : ''}
                    </div>
                    <div class="admin-row-actions"><button class="edit-btn" data-id="${escapeHtml(data.id)}">Edit</button><button class="delete-btn" data-id="${escapeHtml(data.id)}">Delete</button></div>`;
                itemsList.appendChild(row);
            });
            if (sort === 'manual' || sort === 'featured') attachDragHandlers();
        }
        function optimizeImageUrl(url, width=1200) {
            if (!url || !url.includes('res.cloudinary.com') || !url.includes('/upload/')) return url;
            return url.replace('/upload/', `/upload/f_auto,q_auto,w_${width}/`);
        }
        function getCreatedTime(item) {
            if (!item.createdAt) return 0;
            if (typeof item.createdAt.toMillis === 'function') return item.createdAt.toMillis();
            if (typeof item.createdAt === 'number') return item.createdAt;
            return Date.parse(item.createdAt) || 0;
        }
        function escapeHtml(value='') { return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }
        function attachDragHandlers() {
            itemsList.querySelectorAll('.item-row').forEach(row => {
                row.addEventListener('dragstart', () => row.classList.add('dragging'));
                row.addEventListener('dragend', async () => {
                    row.classList.remove('dragging');
                    itemsList.querySelectorAll('.item-row').forEach((r,i)=>r.classList.remove('drop-target'));
                    const rows=[...itemsList.querySelectorAll('.item-row')];
                    const featuredRows=rows.filter(r=>manageItems.find(x=>x.id===r.dataset.id)?.featured);
                    const writes=featuredRows.map((r,i)=>db.collection(viewCategorySelect.value).doc(r.dataset.id).update({featuredOrder:i}));
                    if (writes.length) { try { await Promise.all(writes); } catch(e) { console.warn('Order save failed',e); } }
                });
                row.addEventListener('dragover', e => {
                    e.preventDefault();
                    const dragging=itemsList.querySelector('.dragging');
                    if (dragging && dragging!==row) {
                        row.classList.add('drop-target');
                        const rect=row.getBoundingClientRect();
                        if(e.clientY < rect.top+rect.height/2) row.before(dragging); else row.after(dragging);
                    }
                });
                row.addEventListener('dragleave',()=>row.classList.remove('drop-target'));
            });
        }

        function loadManageItems(category) {
            if (unsubscribeLiveList) unsubscribeLiveList();
            unsubscribeLiveList = db.collection(category).onSnapshot((snapshot) => {
                manageItems = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderManageItems();
                refreshStats();
            }, (error) => {
                itemsList.innerHTML = '<p style="color:#ff4d4d;text-align:center;padding:20px 0;">Unable to load designs.</p>';
            });
        }

        async function refreshStats() {
            const collections = ['gates','windows','doors','staircases','balustrades','furniture','custom'];
            try {
                const snaps = await Promise.all(collections.map(c => db.collection(c).get()));
                const all = snaps.flatMap(s => s.docs.map(d => d.data()));
                const uniqueTags = new Set(all.flatMap(x => Array.isArray(x.tags) ? x.tags : String(x.tags||'').split(',').map(t=>t.trim()).filter(Boolean)));
                const cutoff = Date.now()-30*86400000;
                document.getElementById('stat-total').textContent = all.length;
                document.getElementById('stat-featured').textContent = all.filter(x=>x.featured).length;
                document.getElementById('stat-new').textContent = all.filter(x=>getCreatedTime(x)>=cutoff).length;
                document.getElementById('stat-views').textContent = all.reduce((n,x)=>n+Number(x.views||0),0);
                document.getElementById('stat-enquiries').textContent = all.reduce((n,x)=>n+Number(x.enquiries||0),0);
                document.getElementById('stat-tags').textContent = uniqueTags.size;
            } catch(e) { console.warn('Stats unavailable',e); }
        }

        viewCategorySelect.addEventListener('change', (e) => loadManageItems(e.target.value));
        if (adminSearch) adminSearch.addEventListener('input', renderManageItems);
        if (adminSort) adminSort.addEventListener('change', renderManageItems);
        const adminFeaturedFilter = document.getElementById('admin-featured-filter');
        if (adminFeaturedFilter) adminFeaturedFilter.addEventListener('change', renderManageItems);

        itemsList.addEventListener('click', async (e) => {
            const id = e.target.getAttribute('data-id');
            if (!id) return;

            if(e.target.classList.contains('delete-btn') && confirm("Delete this blueprint from the server permanently?")) {
                await db.collection(viewCategorySelect.value).doc(id).delete();
            }

            if(e.target.classList.contains('edit-btn')) {
                const current = manageItems.find(item => item.id === id);
                if (!current) return;
                const newName = prompt("Design name:", current.name || "");
                if (newName === null) return;
                const trimmed = newName.trim();
                if (!trimmed) { alert("Design name cannot be empty."); return; }
                const currentTags = Array.isArray(current.tags) ? current.tags.join(', ') : (current.tags || '');
                const newTags = prompt("Tags (comma separated):", currentTags);
                if (newTags === null) return;
                const featuredChoice = confirm("Make this design Featured?");
                const tagsArray = newTags.split(',').map(t => t.trim()).filter(Boolean);
                await db.collection(viewCategorySelect.value).doc(id).update({
                    name: trimmed,
                    tags: tagsArray,
                    featured: featuredChoice,
                    featuredOrder: featuredChoice ? (current.featuredOrder ?? Date.now()) : 999999999
                });
                alert("Design updated successfully.");
            }
        });
    </script>
</body>
</html>
