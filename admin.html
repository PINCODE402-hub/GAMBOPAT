<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gambopat Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0d0d; --surface-color: #1a1a1a;
            --text-main: #f5f5f5; --text-muted: #a0a0a0;
            --gold: #D4AF37; --danger: #ff4d4d;
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 40px 20px; display: flex; justify-content: center; }
        
        .container { 
            width: 100%; max-width: 600px; 
            background: var(--surface-color); padding: 40px; 
            border-radius: 16px; border: 1px solid var(--glass-border);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        h2 { color: var(--gold); margin-top: 0; margin-bottom: 30px; text-align: center; letter-spacing: 1px; }
        h3 { border-bottom: 1px solid var(--glass-border); padding-bottom: 10px; margin-top: 30px; color: #fff; }
        
        label { display: block; margin-top: 20px; font-weight: 500; font-size: 0.9rem; color: var(--text-muted); }
        
        input[type="text"], input[type="url"], input[type="email"], input[type="password"], input[type="file"], select { 
            width: 100%; padding: 14px; margin-top: 8px; border-radius: 8px; 
            background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); 
            color: var(--text-main); font-family: 'Poppins', sans-serif; box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input:focus, select:focus { outline: none; border-color: var(--gold); }

        button { 
            width: 100%; background-color: var(--gold); color: #111; 
            border: none; font-weight: bold; cursor: pointer; padding: 14px;
            margin-top: 25px; border-radius: 8px; transition: 0.3s; font-size: 1rem;
        }
        button:hover { background-color: #b5952f; box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }
        button:disabled { background-color: #555; color: #888; cursor: not-allowed; box-shadow: none; }
        
        .hidden { display: none !important; }
        
        /* Item List UI */
        .item-row { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px; margin-top: 10px; background: rgba(0,0,0,0.2); 
            border: 1px solid var(--glass-border); border-radius: 8px;
        }
        .item-row img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; border: 1px solid var(--glass-border); }
        .delete-btn { width: auto; background-color: transparent; border: 1px solid var(--danger); color: var(--danger); padding: 8px 16px; margin: 0; }
        .delete-btn:hover { background-color: var(--danger); color: white; box-shadow: 0 0 10px rgba(255, 77, 77, 0.4); }
        
        /* Radio Toggles */
        .source-toggle { display: flex; gap: 20px; margin-top: 10px; }
        .source-toggle label { display: flex; align-items: center; gap: 8px; margin: 0; color: var(--text-main); cursor: pointer; }
        .source-toggle input { accent-color: var(--gold); width: 18px; height: 18px; cursor: pointer; }
        
        .nav-links { text-align: center; margin-bottom: 30px; font-size: 0.9rem; color: var(--text-muted); }
        .nav-links a { color: var(--gold); text-decoration: none; margin: 0 10px; }
        .nav-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div id="login-section" class="container">
        <h2>TERMINAL ACCESS</h2>
        <label>Email ID</label>
        <input type="email" id="login-email" placeholder="admin@gambopat.com">
        <label>Security Key</label>
        <input type="password" id="login-password" placeholder="••••••••">
        <button id="btn-login">Authenticate</button>
        <div class="nav-links" style="margin-top: 30px;"><a href="index.html">← Return to Main Website</a></div>
    </div>

    <div id="admin-section" class="container hidden">
        <h2>DATABASE MANAGER</h2>
        <div class="nav-links">
            Status: Secure Connection | <a href="#" id="btn-logout">Terminate Session</a> | <a href="index.html">Live Site</a>
        </div>
        
        <h3>Deploy New Blueprint</h3>
        <label>Target Category</label>
        <select id="item-category">
            <option value="gates">Main Gates</option>
            <option value="windows">Window Frames</option>
            <option value="doors">Security Doors</option>
            <option value="staircases">Staircases</option>
            <option value="balustrades">Balustrades</option>
            <option value="furniture">Chairs & Tables</option>
        </select>

        <label>Design Identifier (Name)</label>
        <input type="text" id="item-name" placeholder="e.g., Modern Arch Gate V2">

        <label>Asset Source</label>
        <div class="source-toggle">
            <label><input type="radio" name="image-source" value="upload" checked> Local Drive</label>
            <label><input type="radio" name="image-source" value="url"> Cloud URL</label>
        </div>

        <div id="upload-section">
            <label>Select Blueprint Image</label>
            <input type="file" id="item-image" accept="image/*" multiple>
        </div>

        <div id="url-section" class="hidden">
            <label>Remote Image URL</label>
            <input type="url" id="item-url" placeholder="https://res.cloudinary.com/...">
        </div>

        <button id="btn-add">Upload to Showroom</button>

        <h3 style="margin-top: 50px;">Manage Active Showroom</h3>
        <label>Filter Database by Category</label>
        <select id="view-category">
            <option value="gates">Main Gates</option>
            <option value="windows">Window Frames</option>
            <option value="doors">Security Doors</option>
            <option value="staircases">Staircases</option>
            <option value="balustrades">Balustrades</option>
            <option value="furniture">Chairs & Tables</option>
        </select>

        <div id="items-list" style="margin-top: 20px;"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const CLOUDINARY_CLOUD_NAME = "dwj32uz3y"; 
        const CLOUDINARY_UPLOAD_PRESET = "Gambopat-preset"; 
        const CLOUDINARY_UPLOAD_URL = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`;

        const firebaseConfig = {
            apiKey: "AIzaSyCzbU6d1wh6sezdM1ixhQrA-TCVCHpm-AA",
            authDomain: "gambopat-327be.firebaseapp.com",
            projectId: "gambopat-327be",
            storageBucket: "gambopat-327be.firebasestorage.app",
            messagingSenderId: "334515883953",
            appId: "1:334515883953:web:3cd35ada86b25770a53790",
            measurementId: "G-Y9RG1NKHYF"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // UI Toggles
        const loginSection = document.getElementById('login-section');
        const adminSection = document.getElementById('admin-section');
        const itemsList = document.getElementById('items-list');
        const viewCategorySelect = document.getElementById('view-category');
        
        document.querySelectorAll('input[name="image-source"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                if(e.target.value === 'upload') {
                    document.getElementById('upload-section').classList.remove('hidden');
                    document.getElementById('url-section').classList.add('hidden');
                } else {
                    document.getElementById('upload-section').classList.add('hidden');
                    document.getElementById('url-section').classList.remove('hidden');
                }
            });
        });

        // Auth
        auth.onAuthStateChanged((user) => {
            if (user) {
                loginSection.classList.add('hidden');
                adminSection.classList.remove('hidden');
                loadManageItems(viewCategorySelect.value);
            } else {
                loginSection.classList.remove('hidden');
                adminSection.classList.add('hidden');
            }
        });

        document.getElementById('btn-login').addEventListener('click', () => {
            auth.signInWithEmailAndPassword(document.getElementById('login-email').value, document.getElementById('login-password').value)
                .catch(err => alert("Access Denied: " + err.message));
        });

        document.getElementById('btn-logout').addEventListener('click', (e) => { e.preventDefault(); auth.signOut(); });

        // Add Item Data
        document.getElementById('btn-add').addEventListener('click', async () => {
            const category = document.getElementById('item-category').value;
            const name = document.getElementById('item-name').value;
            const sourceMode = document.querySelector('input[name="image-source"]:checked').value;
            const btnAdd = document.getElementById('btn-add');
            
            if(!name) { alert("Please assign a Design Identifier!"); return; }

            try {
                btnAdd.disabled = true;

                if (sourceMode === "upload") {
                    const files = document.getElementById('item-image').files;
                    if(files.length === 0) { alert("Attach a file to deploy."); btnAdd.disabled = false; return; }
                    
                    btnAdd.innerText = `Uploading ${files.length} assets...`;
                    const uploadPromises = Array.from(files).map(async (file) => {
                        const formData = new FormData();
                        formData.append('file', file);
                        formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
                        const response = await fetch(CLOUDINARY_UPLOAD_URL, { method: 'POST', body: formData });
                        const data = await response.json();
                        if (!response.ok) throw new Error("Upload Interrupted.");
                        return data.secure_url;
                    });

                    const uploadedUrls = await Promise.all(uploadPromises);
                    btnAdd.innerText = "Syncing Database...";
                    await Promise.all(uploadedUrls.map(url => db.collection(category).add({ name, imageUrl: url, createdAt: Date.now() })));
                } else {
                    const finalImageUrl = document.getElementById('item-url').value;
                    if(!finalImageUrl) { alert("Enter an image URL."); btnAdd.disabled = false; return; }
                    btnAdd.innerText = "Syncing Database...";
                    await db.collection(category).add({ name, imageUrl: finalImageUrl, createdAt: Date.now() });
                }

                alert("Blueprint Deployed Successfully!");
                document.getElementById('item-name').value = ""; document.getElementById('item-image').value = ""; document.getElementById('item-url').value = "";
            } catch (error) {
                alert("System Error: " + error.message);
            } finally {
                btnAdd.innerText = "Upload to Showroom"; btnAdd.disabled = false;
            }
        });

        // Live List & Delete
        let unsubscribeLiveList;
        function loadManageItems(category) {
            if(unsubscribeLiveList) unsubscribeLiveList(); 
            unsubscribeLiveList = db.collection(category).onSnapshot((snapshot) => {
                itemsList.innerHTML = "";
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    itemsList.innerHTML += `
                        <div class="item-row">
                            <div style="display: flex; align-items: center; gap: 15px;">
                                <img src="${data.imageUrl}" alt="thumb">
                                <span style="font-weight: 500;">${data.name}</span>
                            </div>
                            <button class="delete-btn" data-id="${doc.id}">Delete</button>
                        </div>`;
                });
            });
        }
        viewCategorySelect.addEventListener('change', (e) => loadManageItems(e.target.value));

        itemsList.addEventListener('click', async (e) => {
            if(e.target.classList.contains('delete-btn') && confirm("Delete this blueprint from the server permanently?")) {
                await db.collection(viewCategorySelect.value).doc(e.target.getAttribute('data-id')).delete();
            }
        });
    </script>
</body>
</html>
